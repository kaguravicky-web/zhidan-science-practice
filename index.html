<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P3 Science · Classification</title>
<style>
:root{
  --bg:#f3f6fa;--card:#fff;--ink:#1f2a37;--mute:#64748b;--line:#94a3b8;
  --brand:#0f766e;--brand2:#14b8a6;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;
  --warn:#92400e;--warnbg:#fef3c7;--ga:#dbeafe;--gb:#fce7f3;--gc:#fef3c7;--gd:#dcfce7
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif}
header{background:linear-gradient(135deg,#0f766e,#0e7490);color:#fff;padding:18px 16px 14px}
header .in{max-width:860px;margin:0 auto}
header h1{margin:0;font-size:22px;letter-spacing:.2px}
header p{margin:4px 0 0;opacity:.92;font-size:14px}
nav{background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:5}
nav .in{max-width:860px;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px}
nav button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
h2{font-size:19px;margin:0 0 8px}
h3{font-size:16px;margin:0 0 6px}
p{margin:6px 0}
ul.facts{margin:6px 0 0;padding-left:20px}
ul.facts li{margin:3px 0}
.zh{color:var(--mute);font-size:14px}
.trap{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pick{display:block;width:100%;text-align:left;border:1px solid #e2e8f0;background:#fff;border-radius:14px;padding:14px;cursor:pointer;font:inherit;color:inherit;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.pick:hover{border-color:var(--brand2)}
.pick h3{margin:2px 0}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:#e0f2f1;color:var(--brand);font-weight:600}
.pill.done{background:var(--okbg);color:var(--ok)}
.btn{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:9px 14px;font:inherit;font-size:15px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.small{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.qtext{font-size:17px;font-weight:600;margin:10px 0 4px;white-space:pre-line}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:2px solid #e2e8f0;border-radius:12px;background:#fff;font:inherit;cursor:pointer;color:inherit}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.explain{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f1f5f9}
.progress{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--brand2)}
textarea{width:100%;min-height:84px;border:2px solid #cbd5e1;border-radius:12px;padding:10px 12px;font:inherit;resize:vertical;margin:8px 0}
textarea:focus{outline:none;border-color:var(--brand2)}
.checks{list-style:none;padding:0;margin:8px 0}
.checks li{margin:4px 0;font-size:15px}
.model{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--okbg)}
.marks{margin-top:10px}
.marks button{border:2px solid #cbd5e1;background:#fff;border-radius:10px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer;color:inherit}
.marks button.on.full{border-color:var(--ok);background:var(--okbg)}
.marks button.on.part{border-color:#ca8a04;background:var(--warnbg)}
.marks button.on.wrong{border-color:var(--bad);background:var(--badbg)}
details.peek{margin:6px 0}
details.peek summary{cursor:pointer;color:var(--brand);font-size:14px}
.chart-title{font-weight:700;margin-bottom:6px}
/* flowchart */
.tree{overflow-x:auto;padding-bottom:4px}
.tree ul{position:relative;padding:18px 0 0;margin:0;display:flex;justify-content:center}
.tree>ul{padding-top:0}
.tree li{list-style:none;position:relative;padding:18px 3px 0;text-align:center;flex:1 1 0;min-width:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;border-top:2px solid var(--line);width:50%;height:18px}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:2px solid var(--line);border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:2px solid var(--line);width:0;height:18px}
.node{display:inline-block;border:2px solid #475569;border-radius:10px;padding:5px 7px;font-size:13px;line-height:1.3;background:#fff;max-width:100%}
.node.root{font-weight:700;font-size:15px;padding:6px 14px}
.grp{display:inline-block;border-radius:10px;padding:6px 6px;font-size:13px;line-height:1.35;min-width:64px;max-width:100%}
.grp b{display:block;font-size:15px}
.grp.A{background:var(--ga)}.grp.B{background:var(--gb)}.grp.C{background:var(--gc)}.grp.D{background:var(--gd)}
/* tables */
table.ct{border-collapse:collapse;width:100%;font-size:14px}
table.ct th,table.ct td{border:1.5px solid #94a3b8;padding:6px 6px;text-align:center}
table.ct th{background:#f1f5f9}
table.ct td:first-child{font-weight:700}
.tick{color:var(--ok);font-weight:700}.cross{color:var(--bad);font-weight:700}
.muted{color:var(--mute)}
footer{max-width:860px;margin:0 auto;padding:4px 16px 28px;color:var(--mute);font-size:12px;text-align:center}
@media (max-width:480px){
  .node,.grp{font-size:11.5px}.grp{min-width:0;padding:6px 3px}
  .tree li{padding-left:1px;padding-right:1px}
  .card.chart{padding:12px 8px}
  nav .in{flex-wrap:nowrap;overflow-x:auto;padding:8px 12px}
  nav button{white-space:nowrap;padding:6px 10px}
  nav .en{display:none}
}
</style>
</head>

/* ---------------- storage ---------------- */
const store = {
  get(k, d){ try { const v = JSON.parse(localStorage.getItem("sci3-" + k)); return v == null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("sci3-" + k, JSON.stringify(v)); } catch(e){} }
};
let wrongMcq = store.get("wrong", {});      // id -> true
let marks = store.get("marks", {});         // oeq id -> full|part|wrong
let drafts = store.get("drafts", {});       // oeq id -> text
let best = store.get("best", {});           // mcq set id -> best score

/* ---------------- helpers ---------------- */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const allMcq = {}; MCQ_SETS.forEach(s => s.qs.forEach(q => allMcq[q.id] = q));
const allOeq = {}; OEQ_SETS.forEach(s => s.qs.forEach(q => allOeq[q.id] = {...q, set:s.id}));

function norm(s){
  return " " + s.toLowerCase()
    .replace(/[’‘]/g, "'")
    .replace(/can't|can not/g, "cannot").replace(/doesn't/g, "does not").replace(/don't/g, "do not").replace(/isn't/g, "is not")
    .replace(/\b6\b/g, "six").replace(/\b2\b/g, "two").replace(/\b8\b/g, "eight").replace(/\b3\b/g, "three").replace(/\b4\b/g, "four")
    .replace(/[^a-z' ]+/g, " ").replace(/\s+/g, " ") + " ";
}
function keyOk(k, text){
  if (k.any) return k.any.filter(r => r.test(text)).length >= k.min;
  const t = k.minus ? text.replace(k.minus, " ") : text;
  return k.re.test(t);
}

let voice = null;
function pickVoice(){
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  voice = vs.find(v => /en-GB|en_GB/.test(v.lang)) || vs.find(v => /en-SG|en-AU/.test(v.lang)) || vs.find(v => /^en/.test(v.lang)) || null;
}
if (window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/____/g, "blank"));
  u.lang = "en-GB"; u.rate = 0.9; if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}

function treeHTML(n){
  if (n.g) return `<li><div class="node">${esc(n.t)}</div><ul><li><div class="grp ${n.g}"><b>${n.g}</b>${n.m.map(esc).join("<br>")}</div></li></ul></li>`;
  return `<li><div class="node${n.root ? " root" : ""}">${esc(n.t)}</div><ul>${n.kids.map(treeHTML).join("")}</ul></li>`;
}
function chartHTML(id){
  const c = CHARTS[id];
  if (c.type === "tree") return `<div class="chart-title">${c.title}</div><div class="tree"><ul>${treeHTML({...c.root, root:true})}</ul></div>`;
  const cell = v => v === 1 ? '<span class="tick">✓</span>' : v === 0 ? '<span class="cross">✗</span>' : esc(v);
  return `<div class="chart-title">${c.title}</div><table class="ct"><tr>${c.cols.map(h => `<th>${esc(h)}</th>`).join("")}</tr>` +
    c.rows.map(r => `<tr>${r.map((v,i) => `<td>${i ? cell(v) : esc(v)}</td>`).join("")}</tr>`).join("") + `</table>`;
}

/* ---------------- tabs ---------------- */
const TABS = [["learn","📘 <span class=en>Learn </span>学"],["quiz","✅ <span class=en>Quiz </span>选择题"],["charts","🗺️ <span class=en>Charts </span>看图题"],["mistakes","📒 <span class=en>Mistakes </span>错题本"],["parent","👪 家长看"]];
let view = store.get("view", "learn");
function renderTabs(){
  const n = Object.keys(wrongMcq).length + Object.values(marks).filter(m => m !== "full").length;
  document.getElementById("tabs").innerHTML = TABS.map(([k, label]) =>
    `<button data-tab="${k}" class="${view === k ? "on" : ""}">${label}${k === "mistakes" && n ? " (" + n + ")" : ""}</button>`).join("");
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  go(b.dataset.tab);
});
function go(v){ view = v; store.set("view", v); quiz = null; oeqSet = null; render(); window.scrollTo(0, 0); }

/* ---------------- views ---------------- */
function render(){
  renderTabs();
  if (view === "learn") return renderLearn();
  if (view === "quiz") return quiz ? renderQuiz() : renderQuizMenu();
  if (view === "charts") return oeqSet ? renderOeq() : renderOeqMenu();
  if (view === "mistakes") return renderMistakes();
  return renderParent();
}

function renderLearn(){
  app.innerHTML = `<div class="card"><h2>Key facts 知识卡片</h2><p class="zh">先读一遍，再去做选择题。点 🔊 可以听英文。</p></div>` +
    LEARN.map((c, i) => `<div class="card"><div class="row" style="justify-content:space-between"><h3>${c.t}</h3>
      <button class="say" data-say="${i}">🔊</button></div>
      <ul class="facts">${c.facts.map(f => `<li>${f}</li>`).join("")}</ul>
      <p class="zh">${c.zh}</p>${c.trap ? `<div class="trap">${c.trap}</div>` : ""}</div>`).join("");
  app.querySelectorAll("[data-say]").forEach(b => b.onclick = () => {
    const c = LEARN[+b.dataset.say];
    say(c.t.replace(/[^\x00-\x7F]/g, "") + ". " + c.facts.map(f => f.replace(/<[^>]+>/g, "")).join(" ") + (c.trap ? " " + c.trap.replace(/⚠️/g, "") : ""));
  });
}

/* ----- MCQ ----- */
let quiz = null;
function renderQuizMenu(){
  app.innerHTML = `<div class="card"><h2>Quiz 选择题</h2><p class="zh">每套 10 题。选错的会自动进错题本。</p></div><div class="grid">` +
    MCQ_SETS.map(s => `<button class="pick" data-set="${s.id}"><span class="pill${best[s.id] === s.qs.length ? " done" : ""}">${s.qs.length} questions${best[s.id] != null ? " · best " + best[s.id] + "/" + s.qs.length : ""}</span>
      <h3>${s.title}</h3><div class="zh">${s.zh}</div></button>`).join("") + `</div>`;
  app.querySelectorAll("[data-set]").forEach(b => b.onclick = () => {
    const s = MCQ_SETS.find(x => x.id === b.dataset.set);
    startQuiz(s.title, s.qs, s.id);
  });
}
function startQuiz(title, qs, setId){
  quiz = {title, setId, qs: qs.map(q => ({...q, order: shuffle([0,1,2,3])})), i:0, score:0, picked:null};
  render(); window.scrollTo(0, 0);
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function renderQuiz(){
  const z = quiz, n = z.qs.length;
  if (z.i >= n){
    if (z.setId && (best[z.setId] == null || z.score > best[z.setId])){ best[z.setId] = z.score; store.set("best", best); }
    app.innerHTML = `<div class="card"><h2>${esc(z.title)} · Done!</h2>
      <p style="font-size:22px;font-weight:700">${z.score} / ${n}</p>
      <p class="zh">${z.score === n ? "全对！🎉" : "错的题已经放进错题本，明天再做一次。"}</p>
      <div class="row"><button class="btn" id="again">Try again 再做一次</button><button class="btn ghost" id="back">Back 返回</button></div></div>`;
    document.getElementById("again").onclick = () => startQuiz(z.title, z.qs, z.setId);
    document.getElementById("back").onclick = () => { quiz = null; render(); };
    return;
  }
  const q = z.qs[z.i];
  app.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(z.title)}</b><span class="muted">Question ${z.i + 1} / ${n} · ✓ ${z.score}</span></div>
    <div class="progress"><i style="width:${z.i / n * 100}%"></i></div>
    <div class="row" style="justify-content:space-between;align-items:flex-start"><p class="qtext">${esc(q.q)}</p><button class="say" id="sayq">🔊</button></div>
    ${q.order.map((oi, k) => `<button class="opt" data-o="${oi}">${"ABCD"[k]}. ${esc(q.o[oi])}</button>`).join("")}
    <div id="after"></div></div>
    <div class="row"><button class="btn ghost small" id="quit">Stop 结束</button></div>`;
  document.getElementById("sayq").onclick = () => say(q.q + " " + q.order.map((oi, k) => "ABCD"[k] + ", " + q.o[oi]).join(". "));
  document.getElementById("quit").onclick = () => { quiz = null; render(); };
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (z.picked != null) return;
    const oi = +b.dataset.o; z.picked = oi;
    const right = oi === q.a;
    if (right){ z.score++; delete wrongMcq[q.id]; }
    else wrongMcq[q.id] = true;
    store.set("wrong", wrongMcq);
    app.querySelectorAll(".opt").forEach(x => { x.disabled = true; const v = +x.dataset.o; if (v === q.a) x.classList.add("right"); else if (v === oi) x.classList.add("wrong"); });
    document.getElementById("after").innerHTML = `<div class="explain"><b>${right ? "✓ Correct!" : "✗ Not quite."}</b> ${esc(q.e)}</div>
      <div class="row" style="margin-top:10px"><button class="btn" id="next">${z.i + 1 < n ? "Next 下一题" : "Finish 完成"}</button></div>`;
    renderTabs();
    document.getElementById("next").onclick = () => { z.i++; z.picked = null; render(); window.scrollTo(0, 0); };
  });
}

/* ----- chart questions ----- */
let oeqSet = null;
function setMarks(s){ return s.qs.filter(q => marks[q.id] === "full").length; }
function renderOeqMenu(){
  app.innerHTML = `<div class="card"><h2>Charts 看图答题</h2><p class="zh">用完整句子写答案，写完点「Check 检查」，再和家长一起对照标准答案打分。</p></div><div class="grid">` +
    OEQ_SETS.map(s => `<button class="pick" data-oset="${s.id}"><span class="pill${setMarks(s) === s.qs.length ? " done" : ""}">${s.qs.length} questions · 全对 ${setMarks(s)}</span>
      <h3>${s.title}</h3><div class="zh">${s.zh}</div></button>`).join("") + `</div>`;
  app.querySelectorAll("[data-oset]").forEach(b => b.onclick = () => { oeqSet = b.dataset.oset; render(); window.scrollTo(0, 0); });
}
function renderOeq(){
  const s = OEQ_SETS.find(x => x.id === oeqSet);
  const qs = s.qs;
  app.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${s.title}</h2><button class="btn ghost small" id="back">Back 返回</button></div>
      <p class="zh">${s.zh} · 先看图，按四步答题：找到 → 往上读特征 → 挑同一项特征 → 写完整句子。</p></div>` +
    s.charts.map(c => `<div class="card chart">${chartHTML(c)}</div>`).join("") +
    qs.map(q => `<div class="card" data-q="${q.id}">
      <div class="row" style="justify-content:space-between"><span class="pill">Q${s.qs.indexOf(q) + 1}</span><button class="say" data-sayq="${q.id}">🔊</button></div>
      <p class="qtext">${esc(q.q)}</p>
      <details class="peek"><summary>📊 Show ${CHARTS[q.chart].title} 看图</summary>${chartHTML(q.chart)}</details>
      <textarea placeholder="Write your answer in full sentences…" data-ta="${q.id}"></textarea>
      <div class="row"><button class="btn" data-check="${q.id}">Check 检查</button></div>
      <div class="fb" id="fb-${q.id}"></div></div>`).join("") +
    `<div class="card" id="sum"></div>`;
  document.getElementById("back").onclick = () => { oeqSet = null; render(); window.scrollTo(0, 0); };
  app.querySelectorAll("[data-ta]").forEach(t => {
    t.value = drafts[t.dataset.ta] || "";
    t.oninput = () => { drafts[t.dataset.ta] = t.value; store.set("drafts", drafts); };
  });
  app.querySelectorAll("[data-sayq]").forEach(b => b.onclick = () => say(allOeq[b.dataset.sayq].q));
  app.querySelectorAll("[data-check]").forEach(b => b.onclick = () => showFeedback(b.dataset.check));
  qs.forEach(q => { if (marks[q.id]) showFeedback(q.id); });
  renderSum(s);
}
function showFeedback(id){
  const q = allOeq[id];
  const text = norm(drafts[id] || "");
  const empty = !(drafts[id] || "").trim();
  const items = q.keys.map(k => `<li>${!empty && keyOk(k, text) ? "✅" : "⬜"} ${esc(k.t)}</li>`).join("");
  const m = marks[id];
  document.getElementById("fb-" + id).innerHTML = `
    ${empty ? `<p class="zh">还没写答案，也可以先看标准答案。</p>` : `<p class="zh" style="margin-top:10px">自动检查（只看关键词，最后以家长判断为准）：</p><ul class="checks">${items}</ul>`}
    <div class="model"><b>Model answer 标准答案：</b><br>${esc(q.model)}</div>
    <div class="marks row"><span class="zh">家长打分：</span>
      <button data-mark="full" class="full${m === "full" ? " on" : ""}">✓ 全对</button>
      <button data-mark="part" class="part${m === "part" ? " on" : ""}">½ 部分对</button>
      <button data-mark="wrong" class="wrong${m === "wrong" ? " on" : ""}">✗ 不对</button></div>`;
  document.querySelectorAll(`#fb-${id} [data-mark]`).forEach(b => b.onclick = () => {
    marks[id] = b.dataset.mark; store.set("marks", marks);
    showFeedback(id); renderTabs();
    const s = OEQ_SETS.find(x => x.id === q.set); if (document.getElementById("sum")) renderSum(s);
  });
}
function renderSum(s){
  const el = document.getElementById("sum"); if (!el) return;
  const c = {full:0, part:0, wrong:0}; s.qs.forEach(q => { if (marks[q.id]) c[marks[q.id]]++; });
  el.innerHTML = `<b>这一套：</b> ✓ 全对 ${c.full} · ½ 部分对 ${c.part} · ✗ 不对 ${c.wrong} · 未打分 ${s.qs.length - c.full - c.part - c.wrong}
    <div class="row" style="margin-top:10px"><button class="btn ghost small" id="reset">清空这一套重新写</button></div>`;
  document.getElementById("reset").onclick = () => {
    if (!confirm("清空这一套的答案和打分？")) return;
    s.qs.forEach(q => { delete marks[q.id]; delete drafts[q.id]; });
    store.set("marks", marks); store.set("drafts", drafts); render();
  };
}

/* ----- mistakes ----- */
function renderMistakes(){
  const mc = Object.keys(wrongMcq).filter(id => allMcq[id]);
  const oe = Object.keys(marks).filter(id => marks[id] !== "full" && allOeq[id]);
  app.innerHTML = `<div class="card"><h2>Mistakes 错题本</h2><p class="zh">选择题做对了会自动移走；看图题重新写，打「全对」就移走。</p>
      ${mc.length ? `<button class="btn" id="redo">Redo ${mc.length} quiz mistakes 重做选错的题</button>` : `<p>选择题没有错题 🎉</p>`}</div>` +
    mc.map(id => { const q = allMcq[id]; return `<div class="card"><p class="qtext" style="margin-top:0">${esc(q.q)}</p>
      <p>Answer 答案：<b>${esc(q.o[q.a])}</b></p><p class="zh">${esc(q.e)}</p>
      <button class="btn ghost small" data-clear="${id}">我会了，移走</button></div>`; }).join("") +
    (oe.length ? `<div class="card"><h3>看图题</h3>` + oe.map(id => { const q = allOeq[id]; return `<div style="border-top:1px solid #e2e8f0;padding:10px 0">
      <p style="margin:0"><b>${marks[id] === "part" ? "½" : "✗"}</b> ${esc(q.q)}</p>
      <p class="zh" style="margin:4px 0">标准答案：${esc(q.model)}</p>
      <button class="btn ghost small" data-open="${id}">再写一次</button></div>`; }).join("") + `</div>` : "");
  const r = document.getElementById("redo");
  if (r) r.onclick = () => { view = "quiz"; startQuiz("Mistakes 错题", mc.map(id => allMcq[id]), null); };
  app.querySelectorAll("[data-clear]").forEach(b => b.onclick = () => { delete wrongMcq[b.dataset.clear]; store.set("wrong", wrongMcq); render(); });
  app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
    const q = allOeq[b.dataset.open]; view = "charts"; store.set("view", "charts"); oeqSet = q.set;
    delete marks[q.id]; store.set("marks", marks); render();
    const card = document.querySelector(`[data-q="${q.id}"]`); if (card) card.scrollIntoView({block:"start"});
  });
}

/* ----- parent guide ----- */
function renderParent(){
  app.innerHTML = `<div class="card"><h2>家长看：怎么用这个页面</h2>
    <ul class="facts">
      <li><b>每天 10 分钟</b>：一套选择题，或者一套看图题，不用多。</li>
      <li><b>先学再做</b>：第一次先读「Learn 学」的卡片，特别是黄色的 ⚠️ 陷阱。</li>
      <li><b>看图题</b>：让他自己写完再点「Check 检查」。自动检查只看关键词，最后由您对照标准答案打「全对 / 部分对 / 不对」。</li>
      <li><b>错题本</b>：每周清一次，选错的题可以一键重做。</li>
    </ul></div>
    <div class="card"><h2>看图题四步法</h2>
    <ol class="facts">
      <li>在图上<b>找到</b>题目里的生物（或字母 P、Q…）。</li>
      <li>从它<b>往上沿线读</b>，把经过的每个特征都列出来。</li>
      <li>比较时挑<b>同一项特征</b>：蝙蝠 can fly，狗 cannot fly。</li>
      <li>写<b>完整句子</b>，两边都写：The eagle can fly but the dog cannot fly.</li>
    </ol></div>
    <div class="card"><h2>最常见的扣分</h2>
    <ul class="facts">
      <li>比的不是同一项特征：“The eagle can fly but the dog has four legs.” ✗</li>
      <li>只写一边：“The dog cannot.” ✗（要写清楚 cannot 什么）</li>
      <li>题目说 <i>Using the chart</i>，却写图上没有的知识：“A penguin is a bird.” ✗</li>
      <li>“Which group… Explain” 只写组名，不写理由。要写：Group A. Like the animals in Group A, it can fly and lays eggs.</li>
      <li>分类陷阱：蝙蝠、鲸鱼是哺乳类；企鹅是鸟；蜘蛛不是昆虫；蘑菇不是植物；蕨类不开花、靠孢子繁殖。</li>
    </ul></div>
    <div class="card"><h2>重新开始</h2><p class="zh">清空这台设备上的所有成绩、错题和答案。</p>
    <button class="btn ghost small" id="wipe">全部清空</button></div>`;
  document.getElementById("wipe").onclick = () => {
    if (!confirm("清空所有成绩、错题和答案？")) return;
    wrongMcq = {}; marks = {}; drafts = {}; best = {};
    ["wrong","marks","drafts","best"].forEach(k => store.set(k, {}));
    render();
  };
}

render();
</script>
</body>
</html>
