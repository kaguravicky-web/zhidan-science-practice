<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P3–P4 Science Practice</title>
<style>
:root{
  --bg:#f3f6fa;--card:#fff;--ink:#1f2a37;--mute:#64748b;--line:#94a3b8;
  --brand:#0f766e;--brand2:#14b8a6;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;
  --warn:#92400e;--warnbg:#fef3c7;--ga:#dbeafe;--gb:#fce7f3;--gc:#fef3c7;--gd:#dcfce7
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif}
header{background:linear-gradient(135deg,#0f766e,#0e7490);color:#fff;padding:16px 16px 12px}
header .in{max-width:860px;margin:0 auto}
header h1{margin:0;font-size:21px;letter-spacing:.2px}
header p{margin:3px 0 0;opacity:.92;font-size:13.5px}
nav{background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:5}
nav .in{max-width:860px;margin:0 auto;display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:9px 16px}
nav button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);white-space:nowrap}
nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
h2{font-size:19px;margin:0 0 8px}
h3{font-size:16px;margin:0 0 6px}
p{margin:6px 0}
ul.facts{margin:6px 0 0;padding-left:20px}
ul.facts li{margin:3px 0}
.zh{color:var(--mute);font-size:14px}
.trap{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:14px}
.sec{margin:18px 2px 8px;font-size:15px;font-weight:700;color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pick{display:block;width:100%;text-align:left;border:1px solid #e2e8f0;background:#fff;border-radius:14px;padding:14px;cursor:pointer;font:inherit;color:inherit;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.pick:hover{border-color:var(--brand2)}
.pick h3{margin:2px 0}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:#e0f2f1;color:var(--brand);font-weight:600}
.pill.done{background:var(--okbg);color:var(--ok)}
.pill.lv{background:#ede9fe;color:#5b21b6}
.pill.p4{background:#fee2e2;color:#9f1239}
.btn{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:9px 14px;font:inherit;font-size:15px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.small{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;flex:none}
/* topic hub */
.tcard{display:flex;gap:12px;align-items:center}
.tcard .ic{font-size:34px;line-height:1;flex:none;width:44px;text-align:center}
.tcard .tx{flex:1;min-width:0}
.tbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tbar h2{margin:0;flex:1;min-width:150px}
.seg{display:flex;background:#e2e8f0;border-radius:12px;padding:3px;gap:3px;margin:0 0 14px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--ink)}
.seg button.on{background:#fff;font-weight:700;color:var(--brand);box-shadow:0 1px 2px rgba(15,23,42,.12)}
/* quiz */
.qtext{font-size:17px;font-weight:600;margin:10px 0 4px;white-space:pre-line}
.stl{list-style:none;padding:0;margin:6px 0 4px}
.stl li{margin:4px 0;padding-left:26px;text-indent:-26px}
.stl b{display:inline-block;width:26px;text-indent:0}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:2px solid #e2e8f0;border-radius:12px;background:#fff;font:inherit;cursor:pointer;color:inherit}
.opt .n{color:var(--mute);margin-right:6px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt .note{display:block;font-size:13px;margin-top:4px;color:var(--mute)}
.opt .note:empty{display:none}
.explain{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f1f5f9}
.progress{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--brand2)}
.big-num{font-size:28px;font-weight:800;color:var(--brand)}
/* photos */
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin:8px 0}
figure.ph{margin:0;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;text-align:center}
figure.ph img{display:block;width:100%;height:100px;object-fit:cover;background:#e2e8f0}
figure.ph .emo{display:flex;align-items:center;justify-content:center;height:100px;font-size:54px}
figure.ph figcaption{font-size:12.5px;padding:4px 4px 5px;line-height:1.25}
.stempics{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.stempics figure.ph{width:min(260px,100%)}
.stempics.two figure.ph{width:calc(50% - 5px);max-width:240px}
.stempics figure.ph img,.stempics figure.ph .emo{height:170px}
.stempics figure.ph .emo{font-size:90px}
/* sort game */
.sortcard{text-align:center}
.sortcard figure.ph{width:min(280px,100%);margin:6px auto}
.sortcard figure.ph img,.sortcard figure.ph .emo{height:190px}
.sortcard figure.ph .emo{font-size:110px}
.sortcard figure.ph figcaption{font-size:17px;font-weight:700}
.bins{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.bin{border:2px solid #cbd5e1;background:#fff;border-radius:12px;padding:12px 8px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;color:inherit}
.bin small{display:block;font-weight:400;color:var(--mute);font-size:12.5px}
.bin.right{border-color:var(--ok);background:var(--okbg)}
.bin.wrong{border-color:var(--bad);background:var(--badbg)}
.bin:disabled{cursor:default}
/* charts */
.chart{margin:8px 0;padding:10px;border:1px solid #e2e8f0;border-radius:12px;background:#fcfdfe}
.chart-title{font-weight:700;margin-bottom:6px;font-size:14.5px}
.svgwrap svg{display:block;width:100%;height:auto;max-height:340px;margin:0 auto}
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:flex;align-items:center;gap:8px;font-size:14px}
.bar-row .bl{flex:0 0 32%;text-align:right;font-weight:600}
.bar-row .bt{flex:1;background:#eef2f7;border-radius:6px;height:20px;overflow:hidden}
.bar-row .bt i{display:block;height:100%;background:#38bdf8;border-radius:6px}
.bar-row .bv{flex:0 0 auto;min-width:30px;font-weight:700}
.unit{font-size:12.5px;color:var(--mute);text-align:right;margin-top:4px}
.tree{overflow-x:auto;padding-bottom:4px}
.tree ul{position:relative;padding:18px 0 0;margin:0;display:flex;justify-content:center}
.tree>ul{padding-top:0}
.tree li{list-style:none;position:relative;padding:18px 3px 0;text-align:center;flex:1 1 0;min-width:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;border-top:2px solid var(--line);width:50%;height:18px}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:2px solid var(--line);border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:2px solid var(--line);width:0;height:18px}
.node{display:inline-block;border:2px solid #475569;border-radius:10px;padding:5px 7px;font-size:13px;line-height:1.3;background:#fff;max-width:100%}
.node.root{font-weight:700;font-size:14px;padding:6px 12px}
.node.qbox{border-style:dashed;font-weight:800;font-size:16px;padding:4px 14px}
.yn{display:block;font-size:11.5px;font-weight:700;color:var(--brand);margin-bottom:2px}
.grp{display:inline-block;border-radius:10px;padding:6px 6px;font-size:13px;line-height:1.35;min-width:56px;max-width:100%}
.grp b{display:block;font-size:15px}
.grp.A{background:var(--ga)}.grp.B{background:var(--gb)}.grp.C{background:var(--gc)}.grp.D{background:var(--gd)}.grp.E{background:#ede9fe}
.flow{display:flex;flex-direction:column;align-items:flex-start;gap:0;font-size:14px}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fbox{border:2px solid #475569;border-radius:10px;padding:6px 10px;background:#fff;font-weight:600}
.fbox.start{font-weight:700;background:#f1f5f9}
.fside{color:var(--brand);font-weight:700}
.fdown{padding:2px 0 2px 18px;color:var(--brand);font-weight:700;font-size:13px}
.fend{display:inline-block;border-radius:10px;padding:6px 14px;background:var(--gd);font-weight:800}
table.ct{border-collapse:collapse;width:100%;font-size:14px}
table.ct th,table.ct td{border:1.5px solid #94a3b8;padding:6px 5px;text-align:center}
table.ct th{background:#f1f5f9}
table.ct td:first-child{font-weight:700}
.tick{color:var(--ok);font-weight:700}.cross{color:var(--bad);font-weight:700}
.muted{color:var(--mute)}
.credits{font-size:12px;color:var(--mute);columns:2;column-gap:16px}
.credits a{color:var(--mute)}
footer{max-width:860px;margin:0 auto;padding:4px 16px 28px;color:var(--mute);font-size:12px;text-align:center}
@media (max-width:480px){
  .node,.grp{font-size:11.5px}.grp{min-width:0;padding:6px 3px}
  .tree li{padding-left:1px;padding-right:1px}
  .chart{padding:10px 6px}
  nav .in{padding:8px 12px}
  nav button{padding:6px 10px}
  .strip{grid-template-columns:repeat(3,1fr)}
  figure.ph img,figure.ph .emo{height:84px}
  .credits{columns:1}
  table.ct{font-size:12.5px}
  .bar-row .bl{flex-basis:36%;font-size:13px}
}
</style>
</head>
<body>
<header><div class="in">
  <h1>🔬 P3–P4 Science Practice</h1>
  <p>每个单元：学 → 分一分 → 练习 · 全部点选，不用打字 · 目标 AL1</p>
</div></header>
<nav><div class="in" id="tabs"></div></nav>
<main id="app"></main>
<footer>Made for Ji Dam's home practice · v2026-11-25-4 · photos: Wikimedia Commons</footer>

<script>
"use strict";
const TOPICS = [];
function TOPIC(t){ TOPICS.push(t); }
</script>
<!-- one file per unit; a missing file is simply skipped -->
<script src="topics/classification.js?v=2026-11-25-4"></script>
<script src="topics/materials.js?v=2026-11-25-4"></script>
<script src="topics/lifecycles.js?v=2026-11-25-4"></script>
<script src="topics/plants.js?v=2026-11-25-4"></script>
<script src="topics/digestive.js?v=2026-11-25-4"></script>
<script src="topics/magnets.js?v=2026-11-25-4"></script>
<script src="topics/light.js?v=2026-11-25-4"></script>
<script src="topics/plantsystem.js?v=2026-11-25-4"></script>
<script src="topics/matter.js?v=2026-11-25-4"></script>
<script src="topics/heat.js?v=2026-11-25-4"></script>
<script>
"use strict";
/* ---------------- data from the topic files ---------------- */
const TH = "https://thumb.wikimedia.org/wikipedia/commons/thumb/";
const ORDER = ["classification","materials","lifecycles","plants","digestive","magnets","light","plantsystem","matter","heat"];
TOPICS.sort((a, b) => (ORDER.indexOf(a.id) + 1 || 99) - (ORDER.indexOf(b.id) + 1 || 99));
const BY_ID = {}, PICS = {}, EMO = {}, ALLQ = {};
const LEVELS = {1:"Level 1 · 看图认识", 2:"Level 2 · 知识点", 3:"Level 3 · 考试题型", 4:"Level 4 · 答题技巧"};
const GROUPS = [["P3","小三 Primary 3"],["P3/P4","小三学、小四也考 P3 & P4"],["P4","小四 Primary 4"]];
for (const t of TOPICS){
  BY_ID[t.id] = t;
  Object.assign(PICS, t.pics || {}); Object.assign(EMO, t.emo || {});
  t.charts = t.charts || {}; t.sorts = t.sorts || []; t.learn = t.learn || [];
  t.sets.forEach(s => { s.key = t.id + ":" + s.id; s.topic = t.id;
    s.qs.forEach((q, i) => { q.id = s.key + "-" + (i + 1); q.set = s.key; q.topic = t.id; ALLQ[q.id] = q; }); });
  t.sorts.forEach(s => { s.key = t.id + ":" + s.id; });
  t.total = t.sets.reduce((a, s) => a + s.qs.length, 0);
}
const TOTAL = Object.keys(ALLQ).length;

/* ---------------- storage ---------------- */
const store = {
  get(k, d){ try { const v = JSON.parse(localStorage.getItem("sci-v3-" + k)); return v == null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("sci-v3-" + k, JSON.stringify(v)); } catch(e){} }
};
let wrong = store.get("wrong", {});       // question id -> true
let best = store.get("best", {});         // set key -> best score
let sortBest = store.get("sortBest", {}); // sort key -> best %
let route = store.get("route", {page:"home"});
if (route.page === "topic" && !BY_ID[route.topic]) route = {page:"home"};

/* ---------------- helpers ---------------- */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const wrongIds = () => Object.keys(wrong).filter(id => ALLQ[id]);
const topicDone = t => t.sets.reduce((a, s) => a + Math.min(best[s.key] || 0, s.qs.length), 0);

function picFail(img){ const s = document.createElement("span"); s.className = "emo"; s.textContent = img.dataset.e || "🖼️"; img.replaceWith(s); }
function thing(id){
  if (PICS[id]){ const p = PICS[id]; return {src: TH + p[0], en: p[1], zh: p[2], emo: p[3]}; }
  if (EMO[id]){ const p = EMO[id]; return {src: null, en: p[1], zh: p[2], emo: p[0]}; }
  return {src: null, en: id, zh: "", emo: "❓"};
}
// caption: undefined = name + Chinese; false = no caption (a quiz photo must not give the answer away); string = that label
function figure(id, caption){
  const t = thing(id);
  const inner = t.src ? `<img src="${t.src}" alt="${caption === false ? "photo" : esc(t.en)}" loading="lazy" referrerpolicy="no-referrer" data-e="${t.emo}" onerror="picFail(this)">`
                      : `<span class="emo">${t.emo}</span>`;
  let cap = "";
  if (caption === undefined) cap = `<figcaption>${esc(t.en)}${t.zh ? `<br><span class="zh">${esc(t.zh)}</span>` : ""}</figcaption>`;
  else if (caption) cap = `<figcaption>${esc(caption)}</figcaption>`;
  return `<figure class="ph">${inner}${cap}</figure>`;
}

let voice = null;
function pickVoice(){
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  voice = vs.find(v => /en-GB|en_GB/.test(v.lang)) || vs.find(v => /en-SG|en-AU/.test(v.lang)) || vs.find(v => /^en/.test(v.lang)) || null;
}
if (window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/___/g, "blank").replace(/°C/g, " degrees Celsius").replace(/[^\x00-\x7F]/g, " "));
  u.lang = "en-GB"; u.rate = 0.9; if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}

/* ---------------- charts ---------------- */
function treeHTML(n, isRoot){
  if (n.g) return `<li><div class="node">${esc(n.t)}</div><ul><li><div class="grp ${"ABCD".includes(n.g) ? n.g : "E"}"><b>${esc(n.g)}</b>${(n.m || []).map(esc).join("<br>")}</div></li></ul></li>`;
  return `<li><div class="node${isRoot ? " root" : ""}">${esc(n.t)}</div><ul>${n.kids.map(k => treeHTML(k)).join("")}</ul></li>`;
}
function keyHTML(n, label){
  const lab = label ? `<span class="yn">${label}</span>` : "";
  if (typeof n === "string") return `<li>${lab}<div class="grp D">${esc(n)}</div></li>`;
  return `<li>${lab}<div class="node${n.box ? " qbox" : " root"}">${esc(n.q)}</div><ul>${keyHTML(n.yes, "Yes")}${keyHTML(n.no, "No")}</ul></li>`;
}
function chartHTML(topicId, id){
  const c = BY_ID[topicId].charts[id];
  if (!c) return "";
  const title = `<div class="chart-title">${esc(c.title)}</div>`;
  if (c.type === "svg") return `<div class="chart">${title}<div class="svgwrap">${c.svg}</div></div>`;
  if (c.type === "bars"){
    const max = Math.max(...c.rows.map(r => r[1]), 1);
    return `<div class="chart">${title}<div class="bars">${c.rows.map(r => `<div class="bar-row"><span class="bl">${esc(r[0])}</span><span class="bt"><i style="width:${r[1] / max * 100}%"></i></span><span class="bv">${esc(r[1])}</span></div>`).join("")}</div>${c.unit ? `<div class="unit">${esc(c.unit)}</div>` : ""}</div>`;
  }
  if (c.type === "tree") return `<div class="chart">${title}<div class="tree"><ul>${treeHTML(c.root, true)}</ul></div></div>`;
  if (c.type === "key") return `<div class="chart">${title}<div class="tree"><ul>${keyHTML(c.root)}</ul></div></div>`;
  if (c.type === "flow") return `<div class="chart">${title}<div class="flow"><div class="fbox start">${esc(c.start)}</div><div class="fdown">↓</div>` +
    c.steps.map(s => `<div class="frow"><div class="fbox">${esc(s.q)}</div><div class="fside">${esc(s.side)}</div></div><div class="fdown">${esc(s.down)} ↓</div>`).join("") +
    `<div class="fend">${esc(c.end)}</div></div></div>`;
  if (c.type === "groups") return `<div class="chart">${title}<table class="ct"><tr>${c.groups.map(g => `<th>${esc(g[0])}</th>`).join("")}</tr>` +
    `<tr>${c.groups.map(g => `<td style="font-weight:400">${g[1].map(esc).join("<br>")}</td>`).join("")}</tr></table></div>`;
  const cell = v => v === 1 ? '<span class="tick">✓</span>' : v === 0 ? '<span class="cross">✗</span>' : esc(v);
  return `<div class="chart">${title}<table class="ct"><tr>${c.cols.map(h => `<th>${esc(h)}</th>`).join("")}</tr>` +
    c.rows.map(r => `<tr>${r.map((v, i) => `<td>${i ? cell(v) : esc(v)}</td>`).join("")}</tr>`).join("") + `</table></div>`;
}

/* ---------------- navigation ---------------- */
let quiz = null, game = null;
function renderTabs(){
  const n = wrongIds().length;
  const on = p => route.page === p || (p === "home" && route.page === "topic");
  document.getElementById("tabs").innerHTML =
    `<button data-go="home" class="${on("home") ? "on" : ""}">🏠 单元 Topics</button>` +
    `<button data-go="mistakes" class="${on("mistakes") ? "on" : ""}">📒 错题本${n ? " (" + n + ")" : ""}</button>` +
    `<button data-go="parent" class="${on("parent") ? "on" : ""}">👪 家长看</button>`;
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-go]"); if (!b) return;
  go({page: b.dataset.go});
});
function go(r){ route = r; store.set("route", r); quiz = null; game = null; render(); window.scrollTo(0, 0); }
function render(){
  renderTabs();
  if (quiz) return renderQuiz();
  if (game) return renderGame();
  if (route.page === "topic") return renderTopic();
  if (route.page === "mistakes") return renderMistakes();
  if (route.page === "parent") return renderParent();
  return renderHome();
}

/* ---------------- home: all topics ---------------- */
function renderHome(){
  const done = TOPICS.reduce((a, t) => a + topicDone(t), 0), pct = TOTAL ? Math.round(done / TOTAL * 100) : 0;
  let html = `<div class="card"><h2>Topics 单元</h2>
    <p>全部 <b>${TOPICS.length}</b> 个单元，<b>${TOTAL}</b> 题。拿过分：<b>${done}</b>（${pct}%）</p>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <p class="zh">点一个单元进去：先「学」，再「分一分」，最后「练习」。AL1 = 每套 9/10 以上。</p></div>`;
  for (const [lv, label] of GROUPS){
    const ts = TOPICS.filter(t => t.lv === lv);
    if (!ts.length) continue;
    html += `<div class="sec">${label}</div><div class="grid">` + ts.map(t => {
      const d = topicDone(t), p = t.total ? Math.round(d / t.total * 100) : 0;
      return `<button class="pick" data-topic="${t.id}"><div class="tcard"><div class="ic">${t.icon}</div><div class="tx">
        <h3>${esc(t.title)}</h3><div class="zh">${esc(t.zh)}</div>
        <div class="progress"><i style="width:${p}%"></i></div>
        <span class="pill${p >= 90 ? " done" : ""}">${d} / ${t.total}</span> <span class="pill ${t.lv === "P4" ? "p4" : "lv"}">${t.lv}</span></div></div></button>`;
    }).join("") + `</div>`;
  }
  app.innerHTML = html;
  app.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => go({page: "topic", topic: b.dataset.topic, tab: "learn"}));
}

/* ---------------- one topic ---------------- */
function renderTopic(){
  const t = BY_ID[route.topic], tab = route.tab || "learn";
  const head = `<div class="tbar"><button class="btn ghost small" id="home">← 单元</button><h2>${t.icon} ${esc(t.title)} <span class="zh" style="font-weight:400">${esc(t.zh)}</span></h2></div>
    <div class="seg">${[["learn","📘 学 Learn"],["sort","🧩 分一分 Sort"],["practice","✅ 练习 Practice"]].map(([k, l]) => `<button data-tab="${k}" class="${tab === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
  let body = "";
  if (tab === "learn") body = learnHTML(t);
  else if (tab === "sort") body = sortMenuHTML(t);
  else body = practiceHTML(t);
  app.innerHTML = head + body;
  document.getElementById("home").onclick = () => go({page: "home"});
  app.querySelectorAll(".seg [data-tab]").forEach(b => b.onclick = () => go({page: "topic", topic: t.id, tab: b.dataset.tab}));
  if (tab === "learn") app.querySelectorAll("[data-say]").forEach(b => b.onclick = () => {
    const c = t.learn[+b.dataset.say];
    say(c.t + ". " + c.facts.map(f => f.replace(/<[^>]+>/g, "")).join(" ") + (c.trap ? " " + c.trap : ""));
  });
  if (tab === "sort") app.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => {
    game = newGame(t.sorts.find(x => x.key === b.dataset.sort)); render(); window.scrollTo(0, 0);
  });
  if (tab === "practice") app.querySelectorAll("[data-set]").forEach(b => b.onclick = () => {
    const s = t.sets.find(x => x.key === b.dataset.set); startQuiz(s.title, s.qs, s.key);
  });
}
function learnHTML(t){
  return `<div class="card"><p class="zh" style="margin:0">先看照片和图认识它们，再读要点。点 🔊 听英文。学完一节就去「分一分」和「练习」。</p></div>` +
    t.learn.map((c, i) => c.sec ? `<div class="sec">${c.sec}</div>` :
      `<div class="card"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h3>${c.t}</h3><button class="say" data-say="${i}">🔊</button></div>
      ${((c.pics || []).length || (c.emo || []).length) ? `<div class="strip">${(c.pics || []).map(p => figure(p)).join("")}${(c.emo || []).map(p => figure(p)).join("")}</div>` : ""}
      ${c.ch ? chartHTML(t.id, c.ch) : ""}
      <ul class="facts">${c.facts.map(f => `<li>${f}</li>`).join("")}</ul>
      <p class="zh">${c.zh}</p>${c.trap ? `<div class="trap">${c.trap}</div>` : ""}</div>`).join("");
}
function sortMenuHTML(t){
  if (!t.sorts.length) return `<div class="card"><p>这个单元没有分类游戏，直接去「练习」。</p></div>`;
  return `<div class="card"><p class="zh" style="margin:0">看照片，点它属于哪一组。每局最多 12 个，每次随机。点错会告诉你为什么。</p></div><div class="grid">` +
    t.sorts.map(s => `<button class="pick" data-sort="${s.key}"><span class="pill${sortBest[s.key] === 100 ? " done" : ""}">${Math.min(12, s.items.length)} things${sortBest[s.key] != null ? " · best " + sortBest[s.key] + "%" : ""}</span>
      <h3>${esc(s.title)}</h3><div class="zh">${esc(s.zh)}</div></button>`).join("") + `</div>`;
}
function practiceHTML(t){
  const d = topicDone(t), pct = t.total ? Math.round(d / t.total * 100) : 0;
  let html = `<div class="card"><p>AL1 目标：每套 <b>9/10 以上</b>。这个单元：<b>${d} / ${t.total}</b>（${pct}%）</p>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <p class="zh">从 Level 1 往下做。选完马上看解释，选错的自动进错题本。</p></div>`;
  [1, 2, 3, 4].forEach(lv => {
    const ss = t.sets.filter(s => s.lv === lv);
    if (!ss.length) return;
    html += `<div class="sec">${LEVELS[lv]}</div><div class="grid">` + ss.map(s =>
      `<button class="pick" data-set="${s.key}"><span class="pill${best[s.key] >= Math.ceil(s.qs.length * 0.9) ? " done" : ""}">${s.qs.length} questions${best[s.key] != null ? " · best " + best[s.key] + "/" + s.qs.length : ""}</span>
      <h3>${esc(s.title)}</h3><div class="zh">${esc(s.zh)}</div></button>`).join("") + `</div>`;
  });
  return html;
}

/* ---------------- sort game ---------------- */
function newGame(s){ return {s, items: shuffle(s.items.slice()).slice(0, 12), i: 0, score: 0, done: false, misses: []}; }
function renderGame(){
  const g = game, n = g.items.length;
  if (g.i >= n){
    const pct = Math.round(g.score / n * 100);
    if (sortBest[g.s.key] == null || pct > sortBest[g.s.key]){ sortBest[g.s.key] = pct; store.set("sortBest", sortBest); }
    app.innerHTML = `<div class="card"><h2>${esc(g.s.title)} · Done!</h2><p class="big-num">${g.score} / ${n}</p>
      ${g.misses.length ? `<p class="zh">点错的：</p><ul class="facts">${g.misses.map(m => `<li><b>${esc(thing(m[0]).en)}</b> → ${esc(m[1])}. ${esc(m[2])}</li>`).join("")}</ul>` : `<p class="zh">全对！🎉</p>`}
      <div class="row" style="margin-top:10px"><button class="btn" id="again">Play again 再玩一次</button><button class="btn ghost" id="back">Back 返回</button></div></div>`;
    document.getElementById("again").onclick = () => { game = newGame(g.s); render(); };
    document.getElementById("back").onclick = () => { game = null; render(); };
    return;
  }
  const it = g.items[g.i];
  app.innerHTML = `<div class="card sortcard"><div class="row" style="justify-content:space-between"><b>${esc(g.s.title)}</b><span class="muted">${g.i + 1} / ${n} · ✅ ${g.score}</span></div>
    <div class="progress"><i style="width:${g.i / n * 100}%"></i></div>
    ${figure(it[0])}
    <div class="bins">${g.s.bins.map(b => `<button class="bin" data-k="${b[0]}">${esc(b[1])}<small>${esc(b[2])}</small></button>`).join("")}</div>
    <div id="after"></div></div>
    <div class="row"><button class="btn ghost small" id="quit">Stop 结束</button></div>`;
  document.getElementById("quit").onclick = () => { game = null; render(); };
  app.querySelectorAll(".bin").forEach(b => b.onclick = () => {
    if (g.done) return; g.done = true;
    const ok = b.dataset.k === it[1];
    const rightBin = g.s.bins.find(x => x[0] === it[1]);
    app.querySelectorAll(".bin").forEach(x => { x.disabled = true; if (x.dataset.k === it[1]) x.classList.add("right"); });
    if (ok) g.score++; else { b.classList.add("wrong"); g.misses.push([it[0], rightBin[1], it[2]]); }
    document.getElementById("after").innerHTML = `<div class="explain">${ok ? "✅ " : "❌ It is <b>" + esc(rightBin[1]) + "</b>. "}${esc(it[2])}</div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="next">${g.i + 1 < n ? "Next 下一个" : "Finish 完成"}</button></div>`;
    document.getElementById("next").onclick = () => { g.i++; g.done = false; render(); };
  });
}

/* ---------------- quiz ---------------- */
function startQuiz(title, qs, setKey){
  quiz = {title, setKey, qs: qs.map(q => ({...q, order: q.fix ? q.o.map((_, i) => i) : shuffle(q.o.map((_, i) => i))})), i: 0, score: 0, picked: null};
  render(); window.scrollTo(0, 0);
}
function stemHTML(q){
  let h = "";
  if (q.pic) h += `<div class="stempics${q.pic.length > 1 ? " two" : ""}">${q.pic.map((p, k) => figure(p, q.pl ? q.pl[k] : false)).join("")}</div>`;
  if (q.ch) h += chartHTML(q.topic, q.ch);
  h += `<div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap"><p class="qtext">${esc(q.q)}</p><button class="say" id="sayq">🔊</button></div>`;
  if (q.st) h += `<ul class="stl">${q.st.map((s, k) => `<li><b>${"ABCD"[k]}</b>${esc(s)}</li>`).join("")}</ul>`;
  return h;
}
function renderQuiz(){
  const z = quiz, n = z.qs.length;
  if (z.i >= n){
    if (z.setKey && (best[z.setKey] == null || z.score > best[z.setKey])){ best[z.setKey] = z.score; store.set("best", best); }
    app.innerHTML = `<div class="card"><h2>${esc(z.title)} · Done!</h2>
      <p class="big-num">${z.score} / ${n}</p>
      <p class="zh">${z.score === n ? "全对！🎉" : z.score >= Math.ceil(n * 0.9) ? "达到 AL1 水平！错的那题去错题本再看一次。" : "错的题已经进错题本。先回「学」看一下，再做一次。"}</p>
      <div class="row"><button class="btn" id="again">Try again 再做一次</button><button class="btn ghost" id="back">Back 返回</button></div></div>`;
    document.getElementById("again").onclick = () => startQuiz(z.title, z.qs, z.setKey);
    document.getElementById("back").onclick = () => { quiz = null; render(); window.scrollTo(0, 0); };
    renderTabs();
    return;
  }
  const q = z.qs[z.i], t = BY_ID[q.topic];
  app.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><b>${t.icon} ${esc(z.title)}</b><span class="muted">${z.i + 1} / ${n} · ✅ ${z.score}</span></div>
    <div class="progress"><i style="width:${z.i / n * 100}%"></i></div>
    ${stemHTML(q)}
    <div id="opts">${q.order.map((oi, k) => `<button class="opt" data-oi="${oi}"><span class="n">(${k + 1})</span>${esc(q.o[oi])}<span class="note"></span></button>`).join("")}</div>
    <div id="after"></div></div>
    <div class="row"><button class="btn ghost small" id="quit">Stop 结束</button></div>`;
  document.getElementById("sayq").onclick = () => say(q.q + (q.st ? " " + q.st.map((s, k) => "ABCD"[k] + ". " + s).join(". ") : "") + ". " + q.order.map((oi, k) => "Option " + (k + 1) + ": " + q.o[oi]).join(". "));
  document.getElementById("quit").onclick = () => { quiz = null; render(); window.scrollTo(0, 0); };
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (z.picked != null) return;
    const oi = +b.dataset.oi; z.picked = oi;
    const ok = oi === q.a;
    if (ok){ z.score++; delete wrong[q.id]; } else wrong[q.id] = true;
    store.set("wrong", wrong);
    app.querySelectorAll(".opt").forEach(x => {
      x.disabled = true; const xi = +x.dataset.oi;
      if (xi === q.a) x.classList.add("right");
      if (xi === oi && !ok) x.classList.add("wrong");
      if (q.n) x.querySelector(".note").textContent = q.n[xi];
    });
    document.getElementById("after").innerHTML = `<div class="explain">${ok ? "✅ Correct! " : "❌ Not quite. "}${esc(q.e)}${q.z ? `<div class="zh" style="margin-top:4px">${esc(q.z)}</div>` : ""}</div>
      <div class="row" style="margin-top:10px"><button class="btn" id="next">${z.i + 1 < n ? "Next 下一题" : "Finish 完成"}</button></div>`;
    document.getElementById("next").onclick = () => { z.i++; z.picked = null; render(); window.scrollTo(0, 0); };
    renderTabs();
  });
}

/* ---------------- mistakes (all topics) ---------------- */
function renderMistakes(){
  const ids = wrongIds();
  if (!ids.length){ app.innerHTML = `<div class="card"><h2>Mistakes 错题本</h2><p>没有错题 🎉</p></div>`; return; }
  const byTopic = TOPICS.map(t => [t, ids.filter(id => ALLQ[id].topic === t.id)]).filter(x => x[1].length);
  app.innerHTML = `<div class="card"><h2>Mistakes 错题本</h2><p>现在有 <b>${ids.length}</b> 道错题。做对了就会自动消失。</p>
    <button class="btn" data-redo="all">Redo all 全部重做</button></div>` +
    byTopic.map(([t, list]) => `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${t.icon} ${esc(t.title)} · ${list.length}</h3>
      <button class="btn small" data-redo="${t.id}">重做这个单元</button></div>
      <ul class="facts">${list.map(id => `<li>${esc(ALLQ[id].q.split("\n")[0])}</li>`).join("")}</ul></div>`).join("");
  app.querySelectorAll("[data-redo]").forEach(b => b.onclick = () => {
    const list = b.dataset.redo === "all" ? ids : ids.filter(id => ALLQ[id].topic === b.dataset.redo);
    startQuiz("Mistakes 错题", shuffle(list.map(id => ALLQ[id])), null);
  });
}

/* ---------------- parent ---------------- */
function renderParent(){
  const credits = Object.values(PICS).map(p => {
    const file = decodeURIComponent(p[0].split("/")[2]);
    return `<div><a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(file)}" target="_blank" rel="noopener">${esc(p[1])}</a></div>`;
  }).join("");
  app.innerHTML = `<div class="card"><h2>家长看 · 怎么用</h2>
    <ul class="facts">
      <li><b>全部是点选，不用打字。</b>每套最多 10 题。现在有 ${TOPICS.length} 个单元、${TOTAL} 题。</li>
      <li><b>每个单元的顺序</b>：先「学」（看照片和图、读要点）→「分一分」玩一局 → 再做「练习」。</li>
      <li><b>四个等级</b>：Level 1 看图认识；Level 2 知识点和易错点；Level 3 学校考试题型（图表、表格、"A and B only" 组合题、实验题）；Level 4 答题技巧——从几个答案里选出能拿满分的，学会开放题怎么写。</li>
      <li><b>AL1 标准</b>：每套稳定 9/10 以上，而且隔几天再做还对。</li>
      <li><b>错题本</b>：所有单元的错题都在这里，第二天先做错题本，做对的会自动消失。</li>
      <li>做题记录只存在这台设备的浏览器里，换设备不会同步。</li>
    </ul>
    <p class="zh">单元按新加坡小三、小四科学课程排列；难度参考名校单元测验的题型，题目是我们自己出的。</p>
    <div class="row" style="margin-top:8px"><button class="btn ghost small" id="wipe">全部清空</button></div></div>
    <div class="card"><h3>Photo credits</h3><p class="zh">照片来自 Wikimedia Commons（各自的 CC 授权，点名字可看作者和授权）。</p><div class="credits">${credits}</div></div>`;
  document.getElementById("wipe").onclick = () => {
    if (!confirm("清空全部做题记录？")) return;
    wrong = {}; best = {}; sortBest = {};
    store.set("wrong", wrong); store.set("best", best); store.set("sortBest", sortBest);
    render();
  };
}

render();
</script>
</body>
</html>
